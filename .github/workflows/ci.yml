name: CI

on:
  push:
    branches: [main, migration/react-docker-postgres]
  pull_request:
    branches: [main, migration/react-docker-postgres]
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # An ephemeral, CI-only Postgres/Redis - never Neon. Keeps the suite
      # fast, free, and isolated, and means no real database credentials
      # ever need to live in Actions secrets for a job that has no use for
      # real data.
      MARKETPLACE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      MARKETPLACE_REDIS_URL: redis://localhost:6379/1
      MARKETPLACE_DEV: "1"
      MARKETPLACE_REQUIRE_EMAIL_VERIFICATION: "0"
      MARKETPLACE_ALLOWED_EMAIL_DOMAINS: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    # Drives the built frontend through a real browser against a real
    # backend, which is the only place a broken form or an unwired button
    # shows up - the API tests pass either way.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Always builds, to validate the Dockerfile on every push/PR. Only
      # pushes to GHCR on a manual (workflow_dispatch) run, so regular CI
      # doesn't publish an image on every commit.
      - run: docker build -f backend/Dockerfile -t ghcr.io/${{ github.repository_owner }}/btu-backend:latest .
      - name: Push image to GHCR (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/btu-backend:latest
