[pytest]
# Without this, `pytest` (as opposed to `python -m pytest`, which adds the
# cwd to sys.path automatically) can't resolve `from main import app` in
# conftest.py/tests - main.py lives directly in backend/, not in an
# importable package. This makes it work the same way regardless of how
# pytest is invoked (bare `pytest`, `python -m pytest`, an IDE runner, or
# CI) - found this the hard way when CI's bare `pytest -v` failed with
# ModuleNotFoundError while the same suite passed locally via `py -m pytest`.
pythonpath = .
